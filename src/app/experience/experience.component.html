<section id="experience" class="min-h-screen bg-[#0e0e0e] text-white py-24 px-6 sm:px-12 md:px-24 flex flex-col items-center justify-center">
    <div class="max-w-5xl w-full">

        <div class="mb-16 text-center md:text-left">
            <h2 class="text-4xl md:text-5xl font-bold tracking-tight">
                <span class="text-indigo-500">Work</span> Experience
            </h2>
            <div class="h-1 w-20 bg-indigo-500 mt-4 rounded-full mx-auto md:mx-0"></div>
        </div>

        <div class="relative border-l border-gray-800 ml-4 md:ml-8 space-y-12">

            <div *ngFor="let exp of experienceList" class="relative pl-8 group">

                <!-- Timeline indicator node -->
                <div
                    class="absolute -left-[9px] top-1.5 h-4 w-4 rounded-full border-2 border-indigo-500 bg-[#0e0e0e] group-hover:bg-indigo-500 transition-all duration-300 shadow-[0_0_12px_rgba(99,102,241,0.6)]">
                </div>

                <!-- Experience Card -->
                <div
                    class="bg-white/5 border border-white/10 p-6 sm:p-8 rounded-2xl backdrop-blur-md hover:border-indigo-500/50 transition-all duration-500 hover:shadow-[0_10px_30px_rgba(99,102,241,0.1)] transform hover:-translate-y-1">

                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3">
                        <span class="text-indigo-400 text-sm font-mono font-medium tracking-wide">
                            {{ exp.period }}
                        </span>
                        <span *ngIf="exp.location" class="text-xs text-gray-500 font-mono">
                            📍 {{ exp.location }}
                        </span>
                    </div>

                    <h3 class="text-2xl sm:text-3xl font-bold text-white group-hover:text-indigo-300 transition-colors">
                        {{ exp.role }}
                    </h3>

                    <h4 class="text-lg font-semibold text-gray-300 mt-1 flex items-center gap-2">
                        <span>🏢</span> {{ exp.company }}
                    </h4>

                    <!-- Bullet points -->
                    <ul class="mt-5 space-y-2.5 text-gray-300 text-sm sm:text-base leading-relaxed">
                        <li *ngFor="let point of exp.points" class="flex items-start gap-3">
                            <span class="text-indigo-400 mt-1 text-sm font-bold flex-shrink-0">▹</span>
                            <span class="text-gray-300">{{ point }}</span>
                        </li>
                    </ul>

                    <!-- Tech pills -->
                    <div class="flex flex-wrap gap-2 mt-6 pt-5 border-t border-white/5">
                        <span *ngFor="let skill of exp.skills"
                            class="text-xs bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">
                            {{ skill }}
                        </span>
                    </div>

                </div>

            </div>

        </div>

    </div>
</section>
